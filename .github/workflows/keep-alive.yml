name: keep-render-awake

on:
  schedule:
    - cron: "*/10 * * * *" # every 12 minutes
  workflow_dispatch: # lets you run it manually to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the backend
        run: curl -fsS --max-time 90 https://littletrackers.onrender.com/healthz
